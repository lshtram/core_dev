<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Admin Dashboard Prototype</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            /* Layout specific override */
            display: flex;
            height: 100vh;
            background-color: #fff; /* Override shared bg */
        }

        /* Sidebar */
        aside {
            width: 250px;
            background-color: #f8fafc;
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .logo { font-weight: 700; font-size: 1.25rem; }
        
        nav { display: flex; flex-direction: column; gap: 0.5rem; }
        
        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            color: var(--muted-foreground);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #e2e8f0;
            color: var(--primary);
            font-weight: 500;
        }

        /* Main Content */
        main { flex: 1; padding: 2rem; overflow-y: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; letter-spacing: -0.025em; }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="search"] {
            width: 300px; /* Specific width */
        }
        
        select {
            background-color: white; /* Contrast */
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--muted-foreground);
            font-weight: 500;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .user-cell { display: flex; align-items: center; gap: 0.75rem; }
        .avatar {
            width: 32px; height: 32px;
            background-color: #e2e8f0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; color: var(--muted-foreground);
        }

        .status-dot {
            height: 8px; width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }
        
        .action-menu { color: var(--muted-foreground); cursor: pointer; text-align: right; }

    </style>
</head>
<body>

<aside>
    <div class="logo">Acme Corp</div>
    <nav>
        <a href="#" class="nav-item">Dashboard</a>
        <a href="#" class="nav-item active">Users (RBAC)</a>
        <a href="#" class="nav-item">Content</a>
        <a href="#" class="nav-item">Settings</a>
    </nav>
</aside>

<main>
    <header>
        <h1>User Management</h1>
        <button class="btn">+ Invite User</button>
    </header>

    <div class="toolbar">
        <input type="search" placeholder="Search users by name or email..." />
        <select>
            <option>All Roles</option>
            <option>Admin</option>
            <option>Manager</option>
            <option>Student</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <div class="user-cell">
                        <div class="avatar">JD</div>
                        <span>John Doe</span>
                    </div>
                </td>
                <td>john@acme.com</td>
                <td><span class="badge badge-admin">System Admin</span></td>
                <td><span class="status-dot"></span>Active</td>
                <td class="action-menu">•••</td>
            </tr>
            <tr>
                <td>
                    <div class="user-cell">
                        <div class="avatar">SJ</div>
                        <span>Sarah Johnson</span>
                    </div>
                </td>
                <td>sarah@acme.com</td>
                <td><span class="badge badge-manager">Manager</span></td>
                <td><span class="status-dot"></span>Active</td>
                <td class="action-menu">•••</td>
            </tr>
            <tr>
                <td>
                    <div class="user-cell">
                        <div class="avatar">MS</div>
                        <span>Mike Smith</span>
                    </div>
                </td>
                <td>mike@student.com</td>
                <td><span class="badge badge-student">Student</span></td>
                <td><span class="status-dot" style="background-color: #cbd5e1;"></span>Offline</td>
                <td class="action-menu">•••</td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
